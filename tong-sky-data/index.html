<!DOCTYPE html>
<html lang="ko">
<head>

<title>서비스 종료 안내</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f9;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#1f2937}
  .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;width:100%;padding:24px;box-sizing:border-box}
  .card{grid-column:2}
  .links{grid-column:3;justify-self:start}
  @media (max-width:900px){.wrap{display:flex;flex-direction:column;align-items:center}}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:48px 40px;text-align:center;max-width:420px}
  h1{font-size:22px;margin:0 0 12px}
  p{font-size:15px;color:#4b5563;margin:0 0 28px;line-height:1.6}
  .blog{display:inline-block;background:#03c75a;color:#fff;text-decoration:none;font-weight:600;padding:14px 32px;border-radius:10px}
  .blog:hover{background:#02b350}
  .links{display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:200px}
  .links a{display:block;background:#fff;color:#1f2937;text-decoration:none;font-weight:600;padding:18px 22px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);border-left:5px solid #2563eb}
  .links a:hover{background:#eef2ff}
  .links a span{float:right;color:#9ca3af}
  @media (max-width:900px){.links{width:100%;max-width:420px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

  </div>
  <div class="links">

</body>
</html>
